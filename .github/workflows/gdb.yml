# Baut avr-gdb fuer alle Systeme (dauert pro System ca. 15 Minuten).
# Start von Hand: GitHub -> Actions -> GDB -> Run workflow
name: GDB

on:
  workflow_dispatch:

env:
  GDB_VERSION: "17.2"
  GMP_VERSION: "6.3.0"
  MPFR_VERSION: "4.2.1"

jobs:
  gdb-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux64,      os: ubuntu-22.04, host: "",                        cc: "gcc",                cxx: "g++" }
          - { name: macos-arm64,  os: macos-latest, host: "",                        cc: "clang -arch arm64",  cxx: "clang++ -arch arm64" }
          - { name: macos-x86_64, os: macos-latest, host: "--host=x86_64-apple-darwin", cc: "clang -arch x86_64", cxx: "clang++ -arch x86_64" }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Werkzeuge (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y m4 libncurses-dev
      - name: GMP statisch bauen
        run: |
          curl -sSLO https://ftp.gnu.org/gnu/gmp/gmp-$GMP_VERSION.tar.xz
          tar xf gmp-$GMP_VERSION.tar.xz && cd gmp-$GMP_VERSION
          ./configure --prefix=$GITHUB_WORKSPACE/deps --disable-shared --enable-static --disable-assembly ${{ matrix.host }}
          make -j4 && make install
      - name: MPFR statisch bauen
        run: |
          curl -sSLO https://ftp.gnu.org/gnu/mpfr/mpfr-$MPFR_VERSION.tar.xz
          tar xf mpfr-$MPFR_VERSION.tar.xz && cd mpfr-$MPFR_VERSION
          ./configure --prefix=$GITHUB_WORKSPACE/deps --disable-shared --enable-static --with-gmp=$GITHUB_WORKSPACE/deps ${{ matrix.host }}
          make -j4 && make install
      - name: GDB bauen
        run: |
          curl -sSLO https://ftp.gnu.org/gnu/gdb/gdb-$GDB_VERSION.tar.xz
          tar xf gdb-$GDB_VERSION.tar.xz && mkdir build && cd build
          ../gdb-$GDB_VERSION/configure --target=avr --prefix=$GITHUB_WORKSPACE/inst ${{ matrix.host }} \
            --with-gmp=$GITHUB_WORKSPACE/deps --with-mpfr=$GITHUB_WORKSPACE/deps --without-python --without-expat \
            --without-lzma --without-zstd --without-babeltrace --without-debuginfod \
            --disable-tui --disable-nls --disable-werror
          make -j4 all-gdb MAKEINFO=true && make install-gdb MAKEINFO=true
      - name: Verpacken
        run: |
          mkdir -p out/${{ matrix.name }}
          cp inst/bin/avr-gdb out/${{ matrix.name }}/ && strip out/${{ matrix.name }}/avr-gdb
          file out/${{ matrix.name }}/avr-gdb
      - uses: actions/upload-artifact@v4
        with:
          name: gdb-${{ matrix.name }}
          path: out/

  gdb-windows:
    # Fertiger Build von Zak Kemble (eigenstaendig, nur System-DLLs)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Herunterladen
        run: |
          gh release download --repo ZakKemble/avr-gcc-build --pattern 'avr-gcc-16.1.0-x64-windows.zip'
          unzip -q avr-gcc-*-x64-windows.zip
          mkdir -p out/windows64 && cp avr-gcc-*-x64-windows/bin/avr-gdb.exe out/windows64/
      - uses: actions/upload-artifact@v4
        with:
          name: gdb-windows64
          path: out/
